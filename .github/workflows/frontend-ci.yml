name: Frontend CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests (Vitest)
        run: npm --prefix frontend run test:run

  playwright-e2e:
    runs-on: ubuntu-latest
    needs: vitest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carhop_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carhop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/carhop_ci
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carhop_ci
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      JWT_SECRET_KEY: ci-secret
      REFRESH_TOKEN_PEPPER: ci-pepper
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      FRONTEND_BASE_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend API
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        working-directory: backend

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Start frontend app
        run: |
          nohup npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173 > frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:5173 && exit 0
            sleep 2
          done
          echo "Frontend did not become ready in time"
          exit 1

      - name: Run Playwright E2E
        run: npm --prefix frontend run e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
            frontend.log
          if-no-files-found: ignore
