services:
  db:
    image: postgres:16
    container_name: carhop_db
    restart: always
    environment:
      POSTGRES_USER: carhop
      POSTGRES_PASSWORD: carhop
      POSTGRES_DB: carhop
    ports:
      - "5432:5432"
    volumes:
      - carhop_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carhop -d carhop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carhop_api
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://carhop:carhop@carhop_db:5432/carhop
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_PEPPER: dev-refresh-pepper-change-me
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      UPLOADS_DIR: /app/uploads
      COOKIE_SECURE: "false"
      COOKIE_HTTPONLY: "true"
      COOKIE_SAMESITE: lax
      STORAGE_BACKEND: local
      # SMTP email — fill these in to enable notifications (leave blank to disable)
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: "587"
      SMTP_USER: "lefteris02tsourdiou@gmail.com"
      SMTP_PASSWORD: "xjel mdjy femv akcz"
      SMTP_FROM: "lefteris02tsourdiou@gmail.com"
      # Stripe (test mode). Leave blank to use simulated payments fallback.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      FRONTEND_BASE_URL: "http://localhost:5173"
      PAYMENTS_CURRENCY: "gbp"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/uploads:/app/uploads

volumes:
  carhop_db_data:
